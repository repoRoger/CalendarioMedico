name: Compilar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generar APK de Calendario Medico
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Inyectar version dinamica en codigo fuente
        run: |
          node -e "
            const fs = require('fs');
            const v = '1.0.${{ github.run_number }}';
            const code = \`export const CURRENT_APP_VERSION = '\${v}';\nexport const CURRENT_VERSION_CODE = ${{ github.run_number }};\nexport const DEFAULT_APK_DOWNLOAD_URL = 'https://github.com/repoRoger/CalendarioMedico/releases/latest/download/CalendarioMedico.apk';\n\`;
            fs.writeFileSync('src/lib/appVersion.ts', code);
            console.log('src/lib/appVersion.ts actualizado a:', v);
          "

      - name: Compilar aplicacion web (Vite)
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Configurar Java JDK (Zulu 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Preparar archivos de distribucion (APK y paquete OTA)
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/CalendarioMedico.apk
          cd dist
          zip -r ../apk-output/dist.zip .
          cd ..
          sha256sum apk-output/dist.zip | awk '{print $1}' > apk-output/dist.zip.sha256
          echo "SHA-256 checksum:"
          cat apk-output/dist.zip.sha256
          node scripts/update_version.mjs "1.0.${{ github.run_number }}" "Actualización OTA v1.0.${{ github.run_number }} con soporte SHA-256."

      - name: Subir APK como artefacto de Actions
        uses: actions/upload-artifact@v4
        with:
          name: CalendarioMedico-APK
          path: apk-output/CalendarioMedico.apk
          retention-days: 14

      - name: Publicar descarga directa en GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Calendario Médico Android v1.0.${{ github.run_number }}"
          make_latest: true
          body: |
            ### 📱 Nueva versión de Calendario Médico para Android
            
            Descarga el archivo **CalendarioMedico.apk** o actualiza al instante desde la app vía OTA.
          files: |
            apk-output/CalendarioMedico.apk
            apk-output/dist.zip
            apk-output/dist.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
