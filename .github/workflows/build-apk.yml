name: Compilar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generar APK de Calendario Medico
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Compilar aplicacion web (Vite)
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Configurar Java JDK (Zulu 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Preparar archivo APK final
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/CalendarioMedico.apk

      - name: Subir APK como artefacto de Actions
        uses: actions/upload-artifact@v4
        with:
          name: CalendarioMedico-APK
          path: apk-output/CalendarioMedico.apk
          retention-days: 14

      - name: Publicar descarga directa en GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Calendario Médico Android v1.0.${{ github.run_number }}"
          make_latest: true
          body: |
            ### 📱 Nueva versión de Calendario Médico para Android
            
            Descarga el archivo **CalendarioMedico.apk** directamente en tu celular Android para probar o actualizar la aplicación.
          files: apk-output/CalendarioMedico.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
